<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud-LocalStore 本地控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">☁</span><div><p class="eyebrow">CLOUD LOCALSTORE</p><h1>文件</h1></div></div>
      <div class="header-actions"><span id="network" class="pill">网络：未配置</span><button id="settings" class="icon-button" title="连接与本地库设置">⚙</button></div>
    </header>

    <section id="settings-panel" class="panel setup hidden">
      <div class="panel-heading"><h2>连接与本地库设置</h2><button id="close-settings" class="secondary">关闭</button></div>
      <h3>本地库</h3>
      <form id="library-form">
        <label>同步目录<div class="input-with-action"><input id="root" name="root" placeholder="例如：D:\\CloudDemo"><button id="browse" type="button" class="secondary">浏览</button></div></label>
        <label>数据目录<input id="data-dir" name="data_dir" placeholder="留空则使用同步目录下的 .clouddrive"></label>
        <div class="actions"><button type="submit">打开本地库</button><button id="init" type="button" class="secondary">初始化并打开</button></div>
      </form>
      <h3>服务端连接</h3><form id="connection-form" class="connection"><label>服务地址<input id="server-url" placeholder="http://127.0.0.1:8080"></label><label>空间<input id="space-id"></label><label>设备<input id="device-id"></label><label>设备令牌<input id="device-token" type="password"></label><label>配对码<input id="pairing-token" type="password"></label><div class="actions"><button type="submit">保存连接</button><button id="sync" type="button" class="secondary">立即同步</button></div></form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="stats" aria-label="状态">
      <div><span>活跃文件</span><strong id="active-files">-</strong></div>
      <div><span>版本总数</span><strong id="versions">-</strong></div>
      <div><span>已删除路径</span><strong id="tombstones">-</strong></div>
      <div><span>监控</span><strong id="monitoring">未运行</strong></div>
    </section>

    <section class="panel file-manager">
      <div class="manager-toolbar"><div class="nav-actions"><button id="go-back" class="icon-button" title="后退">←</button><button id="go-forward" class="icon-button" title="前进">→</button><button id="go-up" class="icon-button" title="上一级">↑</button><button id="refresh-browser" class="icon-button" title="刷新">⟳</button></div><div class="address-bar"><span>⌂</span><nav id="breadcrumbs" aria-label="当前位置"></nav></div><label class="search-box"><span>⌕</span><input id="file-search" placeholder="搜索当前文件夹"></label></div>
      <div class="file-toolbar"><button id="new-folder">新建文件夹</button><button id="new-file" class="secondary">新建文件</button><button id="rename-file" class="secondary">重命名</button><button id="delete-file" class="danger">删除</button><span class="toolbar-spacer"></span><button id="view-details" class="view-button active" title="详细信息">☷</button><button id="view-icons" class="view-button" title="大图标">▦</button><button id="scan" class="secondary">扫描</button><button id="monitor" class="secondary">启动监控</button></div>
      <div class="manager-body"><aside class="tree-panel"><div class="tree-title">位置</div><div id="directory-tree" class="directory-tree"></div><div class="tree-status"><span id="active-files-small">0</span> 个文件</div></aside><div class="browser-pane"><div class="selection-hint" id="selection-hint">未选择项目</div><div id="details-view" class="table-wrap"><table><thead><tr><th class="sortable" data-sort="name">名称</th><th class="sortable" data-sort="modified">修改日期</th><th>类型</th><th class="sortable" data-sort="size">大小</th></tr></thead><tbody id="browser-files"><tr><td colspan="4" class="muted">打开本地库后显示文件</td></tr></tbody></table></div><div id="icons-view" class="icons-view hidden"></div></div></div>
    </section>

    <section id="conflicts-panel" class="panel hidden"><div class="panel-heading"><h2>同步冲突</h2><span class="muted">选择要保留的版本</span></div><div class="table-wrap"><table><thead><tr><th>冲突副本</th><th>原路径</th><th>修改日期</th><th></th></tr></thead><tbody id="conflicts-list"></tbody></table></div></section>

    <section id="preview-panel" class="panel preview-panel hidden"><div class="panel-heading"><h2 id="preview-title">预览</h2><button id="close-preview" class="secondary">关闭</button></div><div id="preview-content"></div></section>

    <section id="versions-panel" class="panel hidden"><div class="panel-heading"><h2>历史版本：<code id="selected-path"></code></h2><button id="close-versions" class="secondary">关闭</button></div><div class="table-wrap"><table><thead><tr><th>版本 ID</th><th>时间</th><th>Manifest</th><th></th></tr></thead><tbody id="versions-list"></tbody></table></div></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
