name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build agent
        run: go build ./cmd/clouddrive-agent
      - name: Build server
        run: go build ./cmd/clouddrive-server
